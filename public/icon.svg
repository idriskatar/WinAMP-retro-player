<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1338"/>
      <stop offset="50%" stop-color="#152468"/>
      <stop offset="100%" stop-color="#070c24"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Chassis Background -->
  <rect x="8" y="8" width="240" height="240" rx="40" fill="url(#bgGrad)" stroke="#4A65C8" stroke-width="6"/>
  <!-- Classic Winamp Lightning Bolt -->
  <path d="M148 24 L52 144 L132 144 L116 232 L212 112 L136 112 Z" 
        fill="url(#boltGrad)" 
        stroke="#FFFFFF" 
        stroke-width="4"
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
